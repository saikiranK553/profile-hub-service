#   org.springframework.web: DEBUG

jwt:
  secret: ${JWT_SECRET:NqjaqhyjvNL4JFDhn76nHNOWPhRFudqDaZ/H6nev8kM=}
  expiration: 900000

eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: localhost