server:
  port: 8080

spring:
  application:
    name: profile-hub-service

  datasource:
    url: jdbc:mysql://localhost:3306/profile_hub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  
  sql:
    init:
      mode: always

#logging:
